name: Conformance

# Per-PR conformance checks: compare generator output against the MD5SUMS
# committed to the repo. tpcgen-cli is built once in the `build` job and
# shared with the test jobs as an artifact; the compare scripts pick it up
# through TPCGEN_CLI_BIN instead of rebuilding it themselves.

on:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  TPCGEN_CLI_BIN: ${{ github.workspace }}/bin/tpcgen-cli

jobs:
  build:
    name: Build tpcgen-cli
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          # Restore only. full-conformance.yml saves this cache on main.
          shared-key: tpcgen-cli-release
          save-if: false

      - name: Build Rust table generators
        run: cargo build --locked --release -p tpcgen-cli

      - name: Upload tpcgen-cli binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: tpcgen-cli
          path: target/release/tpcgen-cli
          if-no-files-found: error
          retention-days: 1

  # Conformance testing against committed MD5SUMS generated from C dbgen.
  # See tpcgen-cli/scripts/tpch/generate-fixtures.sh for how the sums are
  # produced.
  tpch:
    name: TPC-H Conformance Tests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download tpcgen-cli binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: tpcgen-cli
          path: bin

      # Artifacts do not preserve file permissions.
      - name: Make tpcgen-cli executable
        run: chmod +x "$TPCGEN_CLI_BIN"

      - name: Run conformance tests (Rust vs C dbgen MD5SUMS)
        run: |
          cd tpcgen-cli
          for sf in 0.001 0.01 0.1 1; do
            ./scripts/tpch/compare-all-tables.sh --scale "$sf"
          done

  # Conformance testing against the Java / Trino reference implementation.
  tpcds-java:
    name: Conformance Tests (Java)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download tpcgen-cli binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: tpcgen-cli
          path: bin

      # Artifacts do not preserve file permissions.
      - name: Make tpcgen-cli executable
        run: chmod +x "$TPCGEN_CLI_BIN"

      - name: Run conformance tests (Rust vs Java, SF1)
        run: |
          cd tpcgen-cli
          ./scripts/tpcds/compare-all-tables.sh

      # Only tables with at least 1,000,000 source rows are split, so scale
      # factor 10 is the smallest that exercises a part boundary.
      # See https://github.com/datafusion-contrib/tpcgen-rs/issues/457
      - name: Run conformance tests (Rust vs Java, SF10, 10 parts)
        run: |
          cd tpcgen-cli
          ./scripts/tpcds/compare-all-tables.sh --scale 10 --parts 10 --quiet

  # Conformance testing against the C dsdgen reference implementation.
  tpcds-c:
    name: Conformance Tests (C dsdgen)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download tpcgen-cli binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: tpcgen-cli
          path: bin

      # Artifacts do not preserve file permissions.
      - name: Make tpcgen-cli executable
        run: chmod +x "$TPCGEN_CLI_BIN"

      - name: Run conformance tests (Rust vs dsdgen, SF1)
        run: |
          cd tpcgen-cli
          ./scripts/tpcds/compare-all-tables.sh --compat c

      # Scale factor 4 has different internal chunk boundaries than scale factor
      # 1, testing different boundary conditions. This is a regression test for
      # https://github.com/datafusion-contrib/tpcgen-rs/pull/478
      - name: Run conformance tests (Rust --compat c, scale factor 4)
        run: |
          cd tpcgen-cli
          ./scripts/tpcds/compare-all-tables.sh --compat c --scale 4 --quiet

  # Provide one stable status check for branch rules and the merge queue.
  conformance-checks:
    name: Conformance checks
    if: ${{ always() }}
    needs:
      - build
      - tpch
      - tpcds-java
      - tpcds-c
    runs-on: ubuntu-latest
    steps:
      - name: Verify all conformance jobs passed
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          TPCH_RESULT: ${{ needs.tpch.result }}
          TPCDS_JAVA_RESULT: ${{ needs.tpcds-java.result }}
          TPCDS_C_RESULT: ${{ needs.tpcds-c.result }}
        run: |
          set -e
          test "$BUILD_RESULT" = success
          test "$TPCH_RESULT" = success
          test "$TPCDS_JAVA_RESULT" = success
          test "$TPCDS_C_RESULT" = success
