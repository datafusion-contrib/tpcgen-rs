name: Rust

on:
  push:
    branches: ["main"]
  pull_request:
  merge_group:
  workflow_dispatch:  # Allow manual triggering

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Run cargo-fmt
        run: cargo fmt --all -- --check
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Run cargo-clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Check
        run: cargo check --locked --verbose --workspace --all-targets
      - name: Check tpchgen-cli without default features
        run: cargo check --locked -p tpchgen-cli --all-targets --no-default-features
      - name: Check tpcgen-cli without default features
        run: cargo check --locked -p tpcgen-cli --all-targets --no-default-features

  # Documentation examples tests
  test-doc-examples:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Doc Examples (cargo test --workspace --doc)
        run: cargo test --locked --workspace --doc

  # Library and integration tests
  test-workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        with:
          tool: nextest@0.9.140
      # nextest runs lib, bins and test targets by default (doc tests are
      # not supported by nextest and are covered by the job above)
      - name: All Tests (workspace)
        run: cargo nextest run --locked --workspace
      - name: Tests for arrow crates with arrow 59
        run: cargo test --locked -p tpchgen-arrow -p tpcdsgen-arrow --no-default-features --features arrow_59

  # documentation build
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name : Build docs
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --locked --no-deps --workspace

  # Package and verify every crate as `cargo publish` would, without uploading.
  # Runs in the merge queue and manual workflows only.
  package-crates:
    if: ${{ github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Dry-run workspace publish
        run: cargo publish --locked --workspace --dry-run

  # Build wheels and sdists in the merge queue and manual workflows only.
  build-packages:
    if: ${{ github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' }}
    uses: ./.github/workflows/build-py-packages.yml
    with:
      upload-artifacts: false

  # Provide one stable status check for branch rules and the merge queue.
  rust-checks:
    name: Rust checks
    if: ${{ always() }}
    needs:
      - lint
      - test-doc-examples
      - test-workspace
      - docs
      - package-crates
      - build-packages
    runs-on: ubuntu-latest
    steps:
      - name: Verify all Rust jobs passed
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          DOC_TEST_RESULT: ${{ needs.test-doc-examples.result }}
          WORKSPACE_TEST_RESULT: ${{ needs.test-workspace.result }}
          DOCS_RESULT: ${{ needs.docs.result }}
          PACKAGE_CRATES_RESULT: ${{ needs.package-crates.result }}
          PACKAGES_RESULT: ${{ needs.build-packages.result }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -e
          test "$LINT_RESULT" = success
          test "$DOC_TEST_RESULT" = success
          test "$WORKSPACE_TEST_RESULT" = success
          test "$DOCS_RESULT" = success
          # package-crates and build-packages run only for merge queue and manual workflows.
          if [ "$EVENT_NAME" = merge_group ] || [ "$EVENT_NAME" = workflow_dispatch ]; then
            test "$PACKAGE_CRATES_RESULT" = success
            test "$PACKAGES_RESULT" = success
          else
            test "$PACKAGE_CRATES_RESULT" = skipped
            test "$PACKAGES_RESULT" = skipped
          fi
