name: Full Conformance

# Slow, from-source conformance pass that runs on every merge to main
# (plus manual dispatch). Where the per-PR workflow only verifies that
# output matches the MD5SUMS committed to the repo, this workflow
# re-derives the reference data from the reference implementations
# themselves and byte-for-byte diffs against it — guarding both against
# output drift and against the committed MD5SUMS going stale or being
# regenerated from the wrong source.

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-conformance-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  TPCGEN_CLI_BIN: ${{ github.workspace }}/bin/tpcgen-cli

jobs:
  # tpcgen-cli is built once and shared with the jobs below as an artifact;
  # the compare scripts pick it up through TPCGEN_CLI_BIN.
  build:
    name: Build tpcgen-cli
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          # Saved when run on main. Restored by other workflows using the same key.
          shared-key: tpcgen-cli-release
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build Rust table generators
        run: cargo build --locked --release -p tpcgen-cli

      - name: Upload tpcgen-cli binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tpcgen-cli
          path: target/release/tpcgen-cli
          if-no-files-found: error
          retention-days: 1

  tpch-full:
    name: TPC-H vs fresh C dbgen (byte-for-byte)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download tpcgen-cli binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: tpcgen-cli
          path: bin

      # Artifacts do not preserve file permissions.
      - name: Make tpcgen-cli executable
        run: chmod +x "$TPCGEN_CLI_BIN"

      - name: Regenerate reference fixtures from C dbgen
        run: |
          cd tpcgen-cli
          for sf in 0.001 0.01 0.1 1; do
            ./scripts/tpch/generate-fixtures.sh --scale "$sf" --force
          done

      - name: Verify committed MD5SUMS still match the reference
        run: git diff --exit-code -- tpcgen-cli/tests/fixtures/tpch

      - name: Byte-for-byte comparison against fresh reference
        run: |
          cd tpcgen-cli
          for sf in 0.001 0.01 0.1 1; do
            ./scripts/tpch/compare-all-tables.sh --scale "$sf" --full
          done

  tpcds-c-full:
    name: TPC-DS vs C dsdgen reference (byte-for-byte)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download tpcgen-cli binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: tpcgen-cli
          path: bin

      # Artifacts do not preserve file permissions.
      - name: Make tpcgen-cli executable
        run: chmod +x "$TPCGEN_CLI_BIN"

      - name: Download C dsdgen reference fixtures
        run: |
          cd tpcgen-cli
          ./scripts/tpcds/generate-fixtures.sh --compat c --scale 1
          ./scripts/tpcds/generate-fixtures.sh --compat c --scale 2

      - name: Byte-for-byte comparison against C dsdgen
        run: |
          cd tpcgen-cli
          ./scripts/tpcds/compare-all-tables.sh --compat c --scale 1 --full
          ./scripts/tpcds/compare-all-tables.sh --compat c --scale 2 --full

  tpcds-trino-full:
    name: TPC-DS vs fresh Trino Java reference (byte-for-byte)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Java toolchain
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Download tpcgen-cli binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: tpcgen-cli
          path: bin

      # Artifacts do not preserve file permissions.
      - name: Make tpcgen-cli executable
        run: chmod +x "$TPCGEN_CLI_BIN"

      - name: Build Trino Java reference implementation
        run: |
          cd tpcgen-cli
          ./scripts/tpcds/bootstrap-trino.sh

      - name: Generate reference fixtures with the Java implementation
        run: |
          cd tpcgen-cli
          ./scripts/tpcds/generate-fixtures.sh

      - name: Byte-for-byte comparison against the Java reference
        run: |
          cd tpcgen-cli
          ./scripts/tpcds/compare-all-tables.sh --scale 1 --full
