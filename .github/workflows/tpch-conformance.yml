name: TPC-H Conformance

on:
  push:
    branches: ["main"]
    paths:
      - 'tpchgen/**'
      - 'tpcgen-cli/**'
      - '.github/**'
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Conformance testing against committed MD5SUMS generated from C dbgen.
  # See tpcgen-cli/scripts/tpch/generate-fixtures.sh for how the sums are
  # produced.
  conformance-tests:
    # This job name is a required status check in the 'main' branch
    # ruleset — rename both together, or PRs block on a phantom check.
    name: TPC-H Conformance Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: release
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build Rust table generators
        run: |
          cargo build --locked --release -p tpcgen-cli

      - name: Run conformance tests (Rust vs C dbgen MD5SUMS)
        run: |
          cd tpcgen-cli
          for sf in 0.001 0.01 0.1 1; do
            ./scripts/tpch/compare-all-tables.sh --scale "$sf"
          done
