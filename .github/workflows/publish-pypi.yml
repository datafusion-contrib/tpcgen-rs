name: publish-pypi

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  verify-release:
    uses: ./.github/workflows/verify-release.yml

  build:
    needs: [verify-release]
    uses: ./.github/workflows/build-py-packages.yml
    with:
      upload-artifacts: true
      package: all

  release:
    name: Release
    runs-on: ubuntu-latest
    environment: pypi
    needs: [build]
    permissions:
      contents: read
      id-token: write # Use to sign the release artifacts and for pypi trusted publishing
      attestations: write # Used to generate artifact attestation
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: '*'
          merge-multiple: true
          path: dist

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: 'dist/*'

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/
          skip-existing: true
