name: tpcgen-cli-publish-pypi

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build-py-packages.yml
    with:
      upload-artifacts: true
      package: tpcgen-cli

  release:
    name: Release
    runs-on: ubuntu-latest
    environment: pypi
    needs: [build]
    permissions:
      contents: read
      id-token: write # Use to sign the release artifacts and for pypi trusted publishing
      attestations: write # Used to generate artifact attestation
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: '*'
          merge-multiple: true
          path: dist

      - name: Install twine
        run: python -m pip install --upgrade twine

      - name: Check distributions
        run: python -m twine check --strict dist/*

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: 'dist/*'

      - name: Publish to PyPI
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          command: upload
          args: --non-interactive --skip-existing dist/*
