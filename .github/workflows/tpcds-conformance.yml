name: TPC-DS Conformance

on:
  push:
    branches: [ main, master ]
    paths:
      - 'tpcdsgen/**'
      - 'tpcgen-cli/**'
      - '.github/**'
  pull_request:
    branches: [ main, master ]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Conformance testing against the Java / Trino reference implementation.
  conformance-tests:
    name: Conformance Tests (Java)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      with:
        save-if: ${{ github.ref == 'refs/heads/main' }}

    - name: Build Rust table generators
      run: |
        cargo build --locked --release -p tpcgen-cli

    - name: Run conformance tests (Rust vs Java)
      run: |
        cd tpcgen-cli
        ./scripts/tpcds/compare-all-tables.sh

    # Scale factors 4 and 7 are cheap to generate but land the internal chunk
    # boundaries in different places than scale factor 1 does, which is how
    # boundary-dependent bugs like #475 show up.
    - name: Run conformance tests (Rust vs Java, scale factor 4)
      run: |
        cd tpcgen-cli
        ./scripts/tpcds/compare-all-tables.sh --scale 4 --quiet

    - name: Run conformance tests (Rust vs Java, scale factor 7)
      run: |
        cd tpcgen-cli
        ./scripts/tpcds/compare-all-tables.sh --scale 7 --quiet

  # Conformance testing against the C dsdgen reference implementation.
  conformance-tests-c:
    name: Conformance Tests (C dsdgen)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      with:
        save-if: ${{ github.ref == 'refs/heads/main' }}

    - name: Build Rust table generators
      run: |
        cargo build --locked --release -p tpcgen-cli

    - name: Run conformance tests (Rust --compat c vs C dsdgen)
      run: |
        cd tpcgen-cli
        ./scripts/tpcds/compare-all-tables.sh --compat c

    # As above: different chunk boundaries than scale factor 1. These are
    # MD5-only — alamb/tpcds-data publishes the full .dat archives for a few
    # scale factors and 4 and 7 are not among them, so --full cannot run here.
    - name: Run conformance tests (Rust --compat c, scale factor 4)
      run: |
        cd tpcgen-cli
        ./scripts/tpcds/compare-all-tables.sh --compat c --scale 4 --quiet

    - name: Run conformance tests (Rust --compat c, scale factor 7)
      run: |
        cd tpcgen-cli
        ./scripts/tpcds/compare-all-tables.sh --compat c --scale 7 --quiet
