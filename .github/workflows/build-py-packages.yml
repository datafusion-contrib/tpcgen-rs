name: Build Python Packages

on:
  workflow_call:
    inputs:
      upload-artifacts:
        description: "Whether to upload built distributions as artifacts"
        required: false
        default: false
        type: boolean
      package:
        description: "Package to build: all, tpchgen-cli, or tpcgen-cli"
        required: false
        default: all
        type: string
      targets:
        description: "Wheel targets: all or comma-separated <os>-<target> names (e.g. linux-x86_64)"
        required: false
        default: all
        type: string

permissions:
  contents: read

jobs:
  wheel-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - name: Select wheel targets
        id: select
        env:
          TARGETS: ${{ inputs.targets }}
          # Keep the target catalog in YAML; only the Actions output needs JSON.
          WHEEL_MATRIX: |
            # Linux manylinux
            - runner: ubuntu-22.04
              target: x86_64
              manylinux: auto
              os: linux
            - runner: ubuntu-22.04
              target: x86
              manylinux: auto
              os: linux
            - runner: ubuntu-22.04
              target: aarch64
              manylinux: auto
              os: linux
            - runner: ubuntu-22.04
              target: armv7
              manylinux: auto
              os: linux
            - runner: ubuntu-22.04
              target: ppc64le
              manylinux: auto
              os: linux

            # Linux musllinux
            - runner: ubuntu-22.04
              target: x86_64
              manylinux: musllinux_1_2
              os: musllinux
            - runner: ubuntu-22.04
              target: x86
              manylinux: musllinux_1_2
              os: musllinux
            - runner: ubuntu-22.04
              target: aarch64
              manylinux: musllinux_1_2
              os: musllinux
            - runner: ubuntu-22.04
              target: armv7
              manylinux: musllinux_1_2
              os: musllinux

            # Windows
            - runner: windows-latest
              target: x64
              os: windows
            - runner: windows-latest
              target: x86
              os: windows

            # macOS
            - runner: macos-14
              target: aarch64
              os: macos
            - runner: macos-15-intel
              target: x86_64
              os: macos
        run: |
          ruby -rjson -ryaml <<'RUBY'
          matrix = YAML.safe_load(ENV.fetch("WHEEL_MATRIX"))
          targets = ENV.fetch("TARGETS").split(",", -1).map(&:strip)
          unless targets == ["all"]
            by_name = matrix.to_h { |entry| ["#{entry.fetch('os')}-#{entry.fetch('target')}", entry] }
            if targets.empty? || (targets - by_name.keys).any?
              abort "::error::Invalid wheel targets #{targets.inspect}. Valid targets: all, #{by_name.keys.join(', ')}"
            end
            matrix = targets.uniq.map { |name| by_name.fetch(name) }
          end
          File.open(ENV.fetch("GITHUB_OUTPUT"), "a") do |output|
            output.puts("matrix=#{JSON.generate({include: matrix})}")
          end
          RUBY

  wheels:
    needs: wheel-matrix
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      matrix: ${{ fromJSON(needs.wheel-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build tpchgen-cli wheel
        if: ${{ inputs.package == 'all' || inputs.package == 'tpchgen-cli' }}
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          target: ${{ matrix.target }}
          args: --locked --release --out dist
          working-directory: tpchgen-cli
          manylinux: ${{ matrix.manylinux || '' }}
      - name: Build tpcgen-cli wheel
        if: ${{ inputs.package == 'all' || inputs.package == 'tpcgen-cli' }}
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          target: ${{ matrix.target }}
          args: --locked --release --out dist
          working-directory: tpcgen-cli
          manylinux: ${{ matrix.manylinux || '' }}
      - name: Upload tpchgen-cli wheels
        if: ${{ inputs.upload-artifacts && (inputs.package == 'all' || inputs.package == 'tpchgen-cli') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: tpchgen-cli/dist
      - name: Upload tpcgen-cli wheels
        if: ${{ inputs.upload-artifacts && (inputs.package == 'all' || inputs.package == 'tpcgen-cli') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: wheels-tpcgen-cli-${{ matrix.os }}-${{ matrix.target }}
          path: tpcgen-cli/dist

  sdist:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build tpchgen-cli sdist
        if: ${{ inputs.package == 'all' || inputs.package == 'tpchgen-cli' }}
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          command: sdist
          args: --out dist
          working-directory: tpchgen-cli
      - name: Build tpcgen-cli sdist
        if: ${{ inputs.package == 'all' || inputs.package == 'tpcgen-cli' }}
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          command: sdist
          args: --out dist
          working-directory: tpcgen-cli
      - name: Upload tpchgen-cli sdist
        if: ${{ inputs.upload-artifacts && (inputs.package == 'all' || inputs.package == 'tpchgen-cli') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: wheels-sdist
          path: tpchgen-cli/dist
      - name: Upload tpcgen-cli sdist
        if: ${{ inputs.upload-artifacts && (inputs.package == 'all' || inputs.package == 'tpcgen-cli') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sdist-tpcgen-cli
          path: tpcgen-cli/dist
