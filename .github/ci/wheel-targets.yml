# Names in this catalog are accepted by the build-py-packages wheel-targets input.
# Entry order controls the full matrix's display order.

# Linux manylinux
manylinux-x86_64:
  runner: ubuntu-22.04
  target: x86_64
  manylinux: auto
  os: linux
manylinux-x86:
  runner: ubuntu-22.04
  target: x86
  manylinux: auto
  os: linux
manylinux-aarch64:
  runner: ubuntu-22.04
  target: aarch64
  manylinux: auto
  os: linux
manylinux-armv7:
  runner: ubuntu-22.04
  target: armv7
  manylinux: auto
  os: linux
manylinux-ppc64le:
  runner: ubuntu-22.04
  target: ppc64le
  manylinux: auto
  os: linux

# Linux musllinux
musllinux-x86_64:
  runner: ubuntu-22.04
  target: x86_64
  manylinux: musllinux_1_2
  os: musllinux
musllinux-x86:
  runner: ubuntu-22.04
  target: x86
  manylinux: musllinux_1_2
  os: musllinux
musllinux-aarch64:
  runner: ubuntu-22.04
  target: aarch64
  manylinux: musllinux_1_2
  os: musllinux
musllinux-armv7:
  runner: ubuntu-22.04
  target: armv7
  manylinux: musllinux_1_2
  os: musllinux

# Windows
windows-x64:
  runner: windows-latest
  target: x64
  os: windows
windows-x86:
  runner: windows-latest
  target: x86
  os: windows

# macOS
macos-aarch64:
  runner: macos-14
  target: aarch64
  os: macos
macos-x86_64:
  runner: macos-15-intel
  target: x86_64
  os: macos
