[package]
name = "tpcdsgen-arrow"
version = "0.1.0"
edition = "2021"
authors = ["clflushopt", "alamb"]
description = "TPC-DS data generator into Apache Arrow format"
repository = { workspace = true }
readme = "README.md"
license = "Apache-2.0"

[dependencies]
# arrow 60 is used by default; the `arrow_59` feature switches to arrow 59.
arrow_59 = { workspace = true, optional = true }
arrow_60 = { workspace = true }
tpcdsgen = { path = "../tpcdsgen", version = "0.1.0" }

[features]
# Build against arrow 59 instead of the default arrow 60.
arrow_59 = ["dep:arrow_59"]

[dev-dependencies]
arrow_csv_59 = { workspace = true }
arrow_csv_60 = { workspace = true }
regex = "1"
