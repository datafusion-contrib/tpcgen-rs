[package]
name = "tpcdsgen-arrow"
version = "0.1.0"
edition = "2021"
authors = ["clflushopt", "alamb"]
description = "TPC-DS data generator into Apache Arrow format"
repository = { workspace = true }
readme = "README.md"
license = "Apache-2.0"

[dependencies]
# The `csv` feature (for `arrow::csv`) is only needed by the reparse tests, but
# Cargo does not allow optional dev-dependencies, so it is enabled here.
arrow_59 = { workspace = true, optional = true, features = ["csv"] }
arrow_60 = { workspace = true, optional = true, features = ["csv"] }
tpcdsgen = { path = "../tpcdsgen", version = "0.1.0" }

[features]
default = ["arrow_60"]
# Build against arrow 59. Requires `default-features = false`.
arrow_59 = ["dep:arrow_59"]
# Build against arrow 60 (the default).
arrow_60 = ["dep:arrow_60"]

[dev-dependencies]
regex = "1"
