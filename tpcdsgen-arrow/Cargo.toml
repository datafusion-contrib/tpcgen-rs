[package]
name = "tpcdsgen-arrow"
version = { workspace = true }
edition = "2021"
authors = ["clflushopt", "alamb"]
description = "TPC-DS data generator into Apache Arrow format"
repository = { workspace = true }
homepage = "https://github.com/datafusion-contrib/tpcgen-rs/tree/main/tpcdsgen-arrow"
readme = "README.md"
license = "Apache-2.0"

[dependencies]
arrow_59 = { workspace = true, optional = true }
arrow_60 = { workspace = true, optional = true }
tpcdsgen = { workspace = true }

[features]
default = ["arrow_60"]
# Build against arrow 60 (the default).
arrow_60 = ["dep:arrow_60"]
# Build against arrow 59. Also disable default features so arrow 60 is not
# compiled as well.
arrow_59 = ["dep:arrow_59"]

[dev-dependencies]
# Enable the arrow features used by tests and doc examples.
arrow_59 = { workspace = true, features = ["csv", "prettyprint"] }
arrow_60 = { workspace = true, features = ["csv", "prettyprint"] }
regex = "1"
