[workspace]

members = ["tpchgen", "tpcdsgen", "tpchgen-arrow", "tpchgen-cli", "tpcdsgen-arrow", "tpcgen-cli"]

resolver = "2"

[workspace.package]
authors = ["clflushopt", "alamb", "kevinjqliu"]
edition = "2021"
homepage = "https://github.com/datafusion-contrib/tpcgen-rs"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/datafusion-contrib/tpcgen-rs"
version = "4.0.0"
# Minimum supported Rust version (MSRV).
# Enforced by the `msrv` job in .github/workflows/rust.yml.
rust-version = "1.88"

[workspace.dependencies]
tpcdsgen = { path = "tpcdsgen", version = "4.0.0" }
tpcdsgen-arrow = { path = "tpcdsgen-arrow", version = "4.0.0" }
tpcgen-cli = { path = "tpcgen-cli", version = "4.0.0", default-features = false }
tpchgen = { path = "tpchgen", version = "4.0.0" }
tpchgen-arrow = { path = "tpchgen-arrow", version = "4.0.0" }

arrow = { version = "60", default-features = false }
parquet = "60"
# `tpchgen-arrow` and `tpcdsgen-arrow` build against arrow 60 (`arrow_60`,
# default) or arrow 59 (`arrow_59`); the selected version is aliased to `arrow`
# in each crate root.
arrow_59 = { package = "arrow", version = "59", default-features = false }
arrow_60 = { package = "arrow", version = "60", default-features = false }

[profile.release]
codegen-units = 1
lto = true
strip = "debuginfo"

# Temporary: build against unreleased arrow-rs main (what will become 60.1.0)
# to test performance. Remove once arrow 60.1.0 is released.
[patch.crates-io]
arrow = { git = "https://github.com/apache/arrow-rs.git", rev = "3658fc01e8fed4179d476aa3efc34b2723f89dd3" }
parquet = { git = "https://github.com/apache/arrow-rs.git", rev = "3658fc01e8fed4179d476aa3efc34b2723f89dd3" }
