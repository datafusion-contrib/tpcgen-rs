[workspace]

members = [ "tpchgen", "tpcdsgen" , "tpchgen-arrow", "tpchgen-cli", "tpcdsgen-arrow", "tpcgen-cli"]

resolver = "2"

[workspace.package]
authors = ["clflushopt", "alamb"]
edition = "2021"
homepage = "https://github.com/datafusion-contrib/tpcgen-rs"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/datafusion-contrib/tpcgen-rs"
version = "3.0.0"

[workspace.dependencies]
# Two versions of arrow/parquet are supported, selected with the `arrow_59` and
# `arrow_60` feature flags (`arrow_60` is the default). The dependencies are
# renamed so both versions can be declared at once; the selected one is aliased
# back to `arrow` / `parquet` in each crate root. See README.md.
arrow_59 = { package = "arrow", version = "59", default-features = false, features = ["prettyprint"] }
arrow_60 = { package = "arrow", version = "60", default-features = false, features = ["prettyprint"] }
arrow_csv_59 = { package = "arrow-csv", version = "59" }
arrow_csv_60 = { package = "arrow-csv", version = "60" }
parquet_59 = { package = "parquet", version = "59" }
parquet_60 = { package = "parquet", version = "60" }

[profile.release]
codegen-units = 1
lto = true
strip = "debuginfo"
