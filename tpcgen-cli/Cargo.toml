[package]
name = "tpcgen-cli"
version = "0.1.0"
authors = { workspace = true }
description = "Blazing fast pure Rust TPC-H and TPC-DS data generator command line tool."
readme = "README.md"
edition = { workspace = true }
homepage = "https://github.com/datafusion-contrib/tpcgen-rs/tree/main/tpcgen-cli"
license = { workspace = true }
repository = { workspace = true }

[lib]
name = "tpcgen_cli"
path = "src/lib.rs"

[[bin]]
name = "tpcgen-cli"
path = "bin/tpcgen_cli.rs"

[dependencies]
arrow = { workspace = true }
clap = { version = "4.5.32", features = ["derive"] }
env_logger = "0.11.7"
futures-util = { version = "0.3.31", default-features = false, features = ["alloc"] }
indicatif = { version = "0.18.3", optional = true }
log = "0.4.26"
parquet = { workspace = true }
tpcdsgen = { path = "../tpcdsgen", version = "0.1.0" }
tpcdsgen-arrow = { path = "../tpcdsgen-arrow", version = "0.1.0" }
tokio = { version = "1.44.1", features = ["macros", "rt-multi-thread", "sync"] }
tpchgen = { path = "../tpchgen", version = "3.0.0" }
tpchgen-arrow = { path = "../tpchgen-arrow", version = "3.0.0" }

[features]
default = ["indicatif-progress"]
# Enable the default CLI terminal progress bars backed by `indicatif`.
indicatif-progress = ["dep:indicatif"]

[dev-dependencies]
# Enable the arrow features used by tests.
arrow = { workspace = true, features = ["csv"] }
assert_cmd = "2.0"
flate2 = "1.1.0"
predicates = "3.0"
tempfile = "3.20.0"
