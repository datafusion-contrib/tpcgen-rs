[package]
name = "tpchgen-cli"
version = { workspace = true }
authors = { workspace = true }
description = "Blazing fast pure Rust TPC-H data generator command line tool."
readme = "README.md"
edition = { workspace = true }
homepage = "https://github.com/datafusion-contrib/tpcgen-rs/tree/main/tpchgen-cli"
license = { workspace = true }
repository = { workspace = true }

[[bin]]
name = "tpchgen-cli"
path = "bin/tpchgen_cli.rs"

[dependencies]
clap = { version = "4.5.32", features = ["derive"] }
tpcgen-cli = { workspace = true }
tokio = { version = "1.44.1", features = ["macros", "rt-multi-thread"] }

[features]
default = ["indicatif-progress"]
# Enable the default CLI terminal progress bars backed by `indicatif`.
indicatif-progress = ["tpcgen-cli/indicatif-progress"]

[dev-dependencies]
assert_cmd = "2.0"
tempfile = "3.20.0"
